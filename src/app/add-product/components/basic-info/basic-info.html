<div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm space-y-5" [formGroup]="form">
  <div class="flex items-center justify-between pb-3 border-b border-gray-100">
    <div class="flex items-center gap-2 font-bold text-sm text-gray-900">
      <span class="p-1.5 bg-indigo-50 text-indigo-600 rounded-lg text-xs">
        <i class="fa-solid fa-circle-info"></i>
      </span>
      Basic Information
    </div>
    <span class="text-[10px] uppercase font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">Core Attributes</span>
  </div>

  <!-- Title -->
  <div>
    <label class="block text-xs font-bold text-gray-700 mb-1">Product Title / Name <span class="text-red-500">*</span></label>
    <div class="relative">
      <span class="absolute left-3.5 top-2.5 text-gray-400"><i class="fa-solid fa-tag"></i></span>
      <input 
        type="text" 
        formControlName="title"
        placeholder="e.g., Ergonomic Wireless Keyboard"
        class="w-full pl-9 pr-3.5 py-2 text-xs border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
    </div>
  </div>

  <!-- SKU & Category -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div>
      <label class="block text-xs font-bold text-gray-700 mb-1">SKU <span class="text-red-500">*</span></label>
      <div class="flex gap-2">
        <input type="text" formControlName="sku" class="w-full px-3.5 py-2 text-xs border border-gray-200 rounded-xl bg-gray-50 font-mono">
        <button type="button" (click)="generateSKU()" class="px-3 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 rounded-xl text-xs font-bold transition flex items-center gap-1 cursor-pointer">
          <i class="fa-solid fa-rotate"></i> Generate
        </button>
      </div>
    </div>

<div>
      <label class="block text-xs font-bold text-gray-700 mb-1">Category <span class="text-red-500">*</span></label>
      <p-select 
        formControlName="category" 
        [options]="categories" 
        optionLabel="label" 
        optionValue="value" 
        placeholder="Select a Category"
        styleClass="w-full text-xs">
      </p-select>
    </div>
  </div>

  <!-- Description -->
  <div>
    <label class="block text-xs font-bold text-gray-700 mb-1">Description</label>
    <textarea formControlName="description" rows="4" placeholder="Detail specifications..." class="w-full p-3 text-xs border border-gray-200 rounded-xl focus:outline-none"></textarea>
  </div>
</div>
