<div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm space-y-4" [formGroup]="form">
  <div class="flex items-center justify-between pb-3 border-b border-gray-100">
    <div class="flex items-center gap-2 font-bold text-sm text-gray-900">
      <span class="p-1.5 bg-emerald-50 text-emerald-600 rounded-lg text-xs">
        <i class="fa-solid fa-tag"></i>
      </span>
      Pricing & Inventory
    </div>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div>
      <label class="block text-xs font-bold text-gray-700 mb-1">Retail Price ($) <span class="text-red-500">*</span></label>
      <input type="number" formControlName="price" placeholder="0.00" class="w-full px-3.5 py-2 text-xs border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
    </div>
    <div>
      <label class="block text-xs font-bold text-gray-700 mb-1">Stock Units <span class="text-red-500">*</span></label>
      <input type="number" formControlName="stock" placeholder="0" class="w-full px-3.5 py-2 text-xs border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
    </div>
  </div>
</div>
