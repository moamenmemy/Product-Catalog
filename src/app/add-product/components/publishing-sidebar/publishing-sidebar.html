<div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm space-y-4" [formGroup]="form">
  <div class="flex items-center justify-between pb-3 border-b border-gray-100">
    <div class="flex items-center gap-2 font-bold text-sm text-gray-900">
      <span class="p-1.5 bg-emerald-50 text-emerald-600 rounded-lg text-xs">
        <i class="fa-solid fa-tag"></i>
      </span>
      Pricing & Profitability
    </div>
    <span class="text-[10px] uppercase font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded">Margin Calculator</span>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div>
      <label class="block text-xs font-bold text-gray-700 mb-1">Retail Price ($) <span class="text-red-500">*</span></label>
      <div class="relative">
        <span class="absolute left-3.5 top-2.5 text-gray-400 font-bold">$</span>
        <input type="number" formControlName="price" placeholder="120.00" class="w-full pl-7 pr-3.5 py-2 text-xs border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>
    </div>
    <div>
      <label class="block text-xs font-bold text-gray-700 mb-1">Unit Cost (COGS) ($) <span class="text-red-500">*</span></label>
      <div class="relative">
        <span class="absolute left-3.5 top-2.5 text-gray-400 font-bold">$</span>
        <input type="number" formControlName="cost" placeholder="60.00" class="w-full pl-7 pr-3.5 py-2 text-xs border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>
    </div>
  </div>

  <!-- Automated Profitability Box -->
  <div class="bg-emerald-50/60 border border-emerald-100 rounded-xl p-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="text-emerald-600 font-bold text-sm"><i class="fa-solid fa-chart-line"></i></span>
      <div>
        <div class="text-[11px] font-bold text-emerald-800">Automated Unit Profitability</div>
        <div class="text-[11px] text-emerald-700 font-medium">
          <span class="font-bold">{{ calculatedMargin }}% Margin</span> • 
          <span class="text-emerald-800 font-bold">+${{ calculatedProfit }} profit / unit</span>
        </div>
      </div>
    </div>
    <span class="text-[10px] font-extrabold uppercase bg-emerald-200/60 text-emerald-800 px-2.5 py-1 rounded-lg">Healthy Margin</span>
  </div>
</div>
