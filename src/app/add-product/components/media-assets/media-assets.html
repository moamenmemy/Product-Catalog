<div class="bg-white border border-gray-100 rounded-2xl p-6 shadow-sm space-y-4" [formGroup]="form">
  <div class="flex items-center justify-between pb-3 border-b border-gray-100">
    <div class="flex items-center gap-2 font-bold text-sm text-gray-900">
      <span class="p-1.5 bg-purple-50 text-purple-600 rounded-lg text-xs">
        <i class="fa-solid fa-image"></i>
      </span>
      Media & Visual Assets
    </div>
  </div>

  <!-- Main Image Preview Box -->
  @if (productImage) {
    <div class="border rounded-xl p-2 bg-gray-50 text-center">
      <span class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded inline-block mb-2">⭐ Preview</span>
      <div class="h-40 flex items-center justify-center overflow-hidden rounded-lg bg-white border">
        <img [src]="productImage" alt="Product Preview" class="h-full object-contain">
      </div>
    </div>
  }

  <!-- Upload Box -->
  <div class="border-2 border-dashed border-indigo-200 rounded-2xl p-6 text-center bg-indigo-50/20 relative cursor-pointer hover:bg-indigo-400/10 transition">
    <input type="file" accept="image/*" (change)="onFileChange($event)" class="absolute inset-0 opacity-0 cursor-pointer">
    <div class="w-10 h-10 bg-indigo-100 text-indigo-600 rounded-xl flex items-center justify-center mx-auto mb-2">
      <i class="fa-solid fa-cloud-arrow-up text-base"></i>
    </div>
    <p class="text-xs font-bold text-gray-700">Drag & drop image or <span class="text-indigo-600 underline">browse files</span></p>
  </div>
</div>
