<div class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">

  <!-- Header & Back Link -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <div class="flex items-center gap-2 text-xs font-semibold text-gray-400 mb-1">
        <a routerLink="/products" class="hover:text-indigo-600 transition flex items-center gap-1 cursor-pointer">
          <i class="fa-solid fa-arrow-left"></i> Back to Products
        </a>
        <span>/</span>
        <span class="text-gray-700">Add New Product</span>
      </div>
      <h1 class="text-2xl font-black text-gray-900 tracking-tight flex items-center gap-2">
        <i class="fa-solid fa-circle-plus text-indigo-600"></i> Add New Product
      </h1>
    </div>

    <div class="flex items-center gap-3">
      <button 
        type="button" 
        (click)="onCancel()" 
        class="px-4 py-2 border border-gray-200 rounded-xl text-xs font-bold text-gray-700 hover:bg-gray-50 transition cursor-pointer flex items-center gap-2">
        <i class="fa-solid fa-xmark"></i> Cancel
      </button>
      <button 
        type="button" 
        (click)="onSubmit()" 
        [disabled]="addForm.invalid" 
        class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white rounded-xl text-xs font-bold shadow-md shadow-indigo-100 flex items-center gap-2 transition cursor-pointer">
        <i class="fa-solid fa-cloud-arrow-up"></i> Publish to Catalog
      </button>
    </div>
  </div>

  <!-- Form Grid -->
  <form [formGroup]="addForm" (ngSubmit)="onSubmit()" class="grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- Left Column (Basic Info & Pricing Components) -->
    <div class="lg:col-span-7 space-y-6">
      <app-basic-info [form]="addForm"></app-basic-info>
      <app-pricing-inventory [form]="addForm"></app-pricing-inventory>
    </div>

    <!-- Right Column (Media Assets & Publishing Sidebar Components) -->
    <div class="lg:col-span-5 space-y-6">
      <app-media-assets [form]="addForm" [productImage]="productImage()" (fileSelected)="onFileSelected($event)"></app-media-assets>
      <app-publishing-sidebar [form]="addForm"></app-publishing-sidebar>
    </div>

  </form>
</div>
