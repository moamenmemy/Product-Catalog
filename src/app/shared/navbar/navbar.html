<nav class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between gap-6 max-w-7xl mx-auto rounded-xl shadow-sm relative">
  
  <!-- Left Section: Logo & Desktop Nav Links -->
  <div class="flex items-center gap-8">
    
    <!-- Brand Logo (على الشمال دائماً) -->
    <div class="flex items-center gap-2 cursor-pointer">
      <div class="w-9 h-9 rounded-xl text-indigo-600 flex items-center justify-center font-bold">
        <i class="fa-solid fa-cart-shopping"></i>
      </div>
      <a routerLink="/products" class="text-xl font-extrabold text-slate-900 tracking-tight" >
           CatalogHub
      </a>
   
    
    </div>

    <!-- Navigation Links (Desktop) -->
    <div class="hidden md:flex items-center gap-2 font-medium text-sm">
      <a routerLink="/dashboard" 
         routerLinkActive="bg-indigo-50 text-indigo-700 font-semibold shadow-sm" 
         class="flex items-center gap-2 px-3 py-2 rounded-lg text-slate-600 hover:text-indigo-600 transition-colors">
       <i class="fa-solid fa-chart-pie"></i>  Dashboard
      </a>
      
      <a routerLink="/products" 
         routerLinkActive="bg-indigo-50 text-indigo-700 font-semibold shadow-sm" 
         class="flex items-center gap-2 px-3 py-2 rounded-lg text-slate-600 hover:text-indigo-600 transition-colors">
      <i class="fa-solid fa-basket-shopping"></i>  Catalog
      </a>
    </div>

  </div>

  <!-- Right Section: Status, Add Button & Mobile Hamburger Button -->
  <div class="flex items-center gap-4">
    
    <!-- Live Sync Status Badge -->
    <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-emerald-50 border border-emerald-200/60 text-emerald-700 text-xs font-medium rounded-full">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      Live Sync: Active
    </div>

    <!-- Add Product Button (Desktop) -->
  <button 
  routerLink="/products/add" 
  class="hidden md:flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg text-sm shadow-sm transition-all active:scale-95 cursor-pointer">
  <span>+ Add Product</span>
</button>

    <!-- Mobile Hamburger Button (على اليمين في الموبايل) -->
    <button (click)="isMobileMenuOpen = !isMobileMenuOpen" class="md:hidden w-9 h-9 rounded-xl bg-slate-100 text-slate-700 flex items-center justify-center hover:bg-slate-200 transition-colors focus:outline-none cursor-pointer">
      <i class="fa-solid" [class.fa-xmark]="isMobileMenuOpen" [class.text-base]="isMobileMenuOpen" [class.fa-bars]="!isMobileMenuOpen"></i>
    </button>

  </div>

</nav>

<!-- Mobile Dropdown Menu (القائمة المنسدلة للموبايل) -->
@if (isMobileMenuOpen) {
  <div class="md:hidden bg-white border-b border-slate-200 px-6 py-4 flex flex-col gap-2 shadow-lg animate-fadeIn">
    <a routerLink="/dashboard" (click)="isMobileMenuOpen = false" routerLinkActive="bg-indigo-50 text-indigo-700 font-semibold" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-700 font-bold hover:bg-slate-50 transition-colors">
      <i class="fa-solid fa-chart-pie text-indigo-600 w-5"></i> Dashboard
    </a>
    <a routerLink="/products" (click)="isMobileMenuOpen = false" routerLinkActive="bg-indigo-50 text-indigo-700 font-semibold" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-700 font-bold hover:bg-slate-50 transition-colors">
      <i class="fa-solid fa-basket-shopping text-indigo-600 w-5"></i> Catalog
    </a>
    
    <!-- Add Product Button جوه القائمة في الموبايل -->
    <a routerLink="/products/add" (click)="isMobileMenuOpen = false" class="mt-2 flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-3 rounded-xl text-sm shadow-sm transition-all">
      <i class="fa-solid fa-plus"></i> Add Product
    </a>
  </div>
}
